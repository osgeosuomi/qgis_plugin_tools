[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[project]
name = "qgis-plugin-tools"
version = "1.1.1.post0"
authors = [{ name = "3Liz, Gispo Ltd.", email = "info@gispo.fi" }]
maintainers = [
  { name = "Gispo Ltd.", email = "info@gispo.fi" },
  { name = "OSGeo Suomi", email = "info@osgeo.fi" },
]
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = []
build = ["uv"]

keywords = ["qgis", "QGIS", "PyQGIS"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Operating System :: OS Independent",
]

[project.urls]
homepage = "https://github.com/osgeosuomi/qgis_plugin_tools"

[tool.uv.build-backend]
module-name = "qgis_plugin_tools"
include = [
  "py.typed",
  "metadata.txt",
  "resources/**/*",
  "**/*.svg",
  "**/*.ts",
  "**/*.ui",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.qgis_plugin_dev_tools]
# Not a real plugin, but with these changes, qpdt hooks work
plugin_package_name = "qgis_plugin_tools"
translation_language_codes = ["fi"]
translation_search_paths = ["src/qgis_plugin_tools"]
translation_destination_path = "src/qgis_plugin_tools/resources/i18n"
translation_pylupdate_command = "pylupdate6"

[tool.uv]
default-groups = ["dev", "lint"]

[dependency-groups]
dev = [
  "requests",
  # Debugging
  "debugpy==1.5.1",
  # Testing
  "pytest>=9.1.1",
  "pytest-cov",
  "pytest-qt",
  "pytest-qgis",
  "pytest-mock",
  "pytest-rerunfailures>=16.1",
  "pytest-xdist>=3.8.0",
  # Tools
  "copier",
]
lint = [
  # Linting and formatting (ensure precommit yaml has same versions)
  "prek>=0.5.1",
  "ruff>=0.16.8",
  "mypy>=2",
  "flake8>=7.3.0",
  "bandit[toml]>=1.9.4",
  # flake8 plugins
  "flake8-qgis>=2.1.0",
  "flake8-pyproject>=1.2.4",
  "flake8-spellcheck>=0.28.0",
  # Stubs for type checks
  "PyQt6-stubs==20250824",
  "types-requests",
]

[tool.ruff]
target-version = "py312"
line-length = 88

lint.ignore = [
  "FIX",   # flake8-fixme
  "TD002", # Missing author in TODO
  "D100",  # Missing docstring in public module
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic method
  "D107",  # Missing docstring in `__init__`
  # Conflicting rules (formatter)
  "D203",   # one-blank-line-before-class, D211 used (no-blank-line-before-class)
  "D213",   # multi-line-summary-second-line, D212 used (multi-line-summary-first-line)
  "COM812", # missing-trailing-comma (formatter will enforce this)
  "ISC001", # single-line-implicit-string-concatenation
  "UP037",  # quoted-annotation (quoted annotations are used with TYPE_CHECKING imports)
  "ERA001", # commented-out-code - messes with .copyright-header.txt lists the copyright years
  "D1",     # undocumented-*
  "D2",     # docstring whitespace and summary formatting
  "D4",     # docstring content and punctuation
  "ANN401", # any-type - Any is preferred over object
]

# List of all rules https://docs.astral.sh/ruff/rules/
lint.select = ["ALL"]

lint.unfixable = [
  "F401", # Unused imports
  "F841", # Unused variables
]

# Avoid flagging (and removing) `SC200` from any `# noqa`
# directives, despite Ruff's lack of support for `flake8-spellcheck`.
lint.external = ["SC200", "QGS"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)Copyright \\(C\\)"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["qgis_plugin_tools"]

[tool.ruff.lint.per-file-ignores]
"{test,test_integration,test_e2e}/*" = [
  "INP001",
  "D",       # pydocstyle
  "DTZ",     # flake8-datetimez
  "FBT",     # flake8-boolean-trap
  "TD",      # flake8-todos
  "S",       # flake8-bandit
  "SLF",     # flake8-self
  "ANN201",  # Missing return type annotation for public function
  "E501",    # Line too long
  "C901",    # Function is too complex
  "PLR2004", # Magic value used in comparison, consider replacing `2000` with a constant variable
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments in function definition
  "PLR0915", # Too many statements
  "ARG001",  # Unused function argument
  "ARG002",  # Unused method argument
]
"src/qgis_plugin_tools/widgets/*" = ["ANN201", "ANN001", "ANN204"]
"src/qgis_plugin_tools/tools/logger_processing.py" = [
  "ANN001",
  "ANN201",
  "ANN202",
  "N802",
  "N803",
  "ARG002",
]
"src/qgis_plugin_tools/tools/algorithm_processing.py" = [
  "ANN001",
  "ANN201",
  "ANN202",
  "N802",
  "N803",
  "ARG002",
]

[tool.flake8]
max-line-length = 88
spellcheck-targets = "names"
dictionaries = "en_US,python,technical"
select = ["SC", "QGS"]
per-file-ignores = [
  "test/*:SC200,QGS",
  "test_integration/*:SC200,QGS",
  "test_e2e/*:SC200,QGS",
]

[tool.bandit]
exclude_dirs = [".venv", "test"]

[tool.mypy]
python_version = "3.12"
follow_imports = "normal"
show_column_numbers = true
check_untyped_defs = true

[tool.coverage.paths]
source = ["src", "**/site-packages"]

[tool.coverage.run]
branch = true
source_pkgs = ["qgis_plugin_tools"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-n auto"
